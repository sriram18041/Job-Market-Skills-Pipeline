services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs_user
      POSTGRES_PASSWORD: jobs_password
      POSTGRES_DB: jobs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs_user -d jobs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobs_user:jobs_password@postgres:5432/jobs_db

  dashboard:
    build: .
    entrypoint: ["streamlit", "run", "/app/dashboard/app.py", "--server.address=0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobs_user:jobs_password@postgres:5432/jobs_db
    ports:
      - "8501:8501"

  # One-off service: not started by `docker compose up`. Run explicitly with
  # `docker compose run --rm powerbi-export` to (re)generate the Power BI
  # CSV extracts in ./powerbi/data on the host, which Power BI Desktop then
  # reads directly -- no Postgres driver needed on Windows.
  powerbi-export:
    build: .
    entrypoint: ["python", "export_powerbi.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobs_user:jobs_password@postgres:5432/jobs_db
    volumes:
      - ./powerbi:/app/powerbi

volumes:
  pgdata:
