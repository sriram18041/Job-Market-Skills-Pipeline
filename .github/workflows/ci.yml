name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Refresh the dataset daily at 06:17 UTC (off the hour, to avoid the
    # top-of-hour pile-up on GitHub's shared runners).
    - cron: "17 6 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  test:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobs_user
          POSTGRES_PASSWORD: jobs_password
          POSTGRES_DB: jobs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs_user -d jobs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobs_user:jobs_password@localhost:5432/jobs_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests dashboard

      - name: Run tests
        run: pytest -v

  run-pipeline:
    name: Run pipeline against live data
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobs_user
          POSTGRES_PASSWORD: jobs_password
          POSTGRES_DB: jobs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs_user -d jobs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jobs_user:jobs_password@localhost:5432/jobs_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run full ETL pipeline (extract -> transform -> load)
        working-directory: src
        run: python pipeline.py
